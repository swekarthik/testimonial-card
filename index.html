<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreatFrontEnd Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Tailwind CDN allows you to use Tailwind classes immediately in your HTML without any installation steps. 
      If you're not using Tailwind, you may delete the <script> -->
    <!-- Get started on Tailwind: https://tailwindcss.com/docs/installation/play-cdn -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <style>
      /* Desktop */

    body{
      background-image: linear-gradient(to bottom, #f9fafb, #d2d6db);
    }

      article {
        margin: 200px auto 0 auto;
        display: flex;
        gap: 16px;
        flex-direction: column;
        width: 340px;
        height: 233px;
        font-size: 16px;
        background: white;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0px 1px 2px -1px rgb(0 0 0 / 0.10), 0px 1px 3px 0 rgb(0 0 0 / 0.10);
        font-family: "Noto Sans",serif;

        .header{
          display: flex;
          gap: 16px;
        }

        .header h3{
          font-size: 18px;
          font-weight: 600;
        }

        img{
          width: 48px;
          height: 48px;
        }

        .description{
          color: #525252;
          font-weight: 400;
        }
      }
    </style>
  </head>
  <body>
    <article>
      <div class="header">
        <img src="./img/profile-thumbnail.png" alt="">
        <div>
          <h3>Sarah Dole</h3>
          <p class="username">@sarahdole</p>
        </div>
      </div>
      <p class="description">
        I've been searching for high-quality abstract images for my design projects, and I'm thrilled to have found this platform. The variety and depth of creativity are astounding!
      </p>
    </article>
    <script src="js/index.js"></script>
  </body>
</html>
